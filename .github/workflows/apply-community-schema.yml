name: Apply community schema (production)

on:
  workflow_dispatch:

concurrency:
  group: apply-community-schema-production
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply community tables
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_POSTGRES_SERVICE_NAME: ${{ vars.RAILWAY_POSTGRES_SERVICE_NAME }}
        run: |
          set -euo pipefail
          echo "Schema workflow v2 (public DATABASE_URL — does not use railway run)"
          git rev-parse HEAD
          if [ -z "${RAILWAY_TOKEN:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add GitHub secret RAILWAY_TOKEN or DATABASE_URL (public Postgres URL)."
            exit 1
          fi
          if [ -n "${DATABASE_URL:-}" ]; then
            echo "Using DATABASE_URL from GitHub secret…"
            if echo "$DATABASE_URL" | grep -q 'railway\.internal'; then
              echo "::error::DATABASE_URL secret points at postgres.railway.internal. Replace it with Railway Postgres → Connect → Public URL."
              exit 1
            fi
          else
            npm install -g @railway/cli
            echo "Resolving DATABASE_PUBLIC_URL from Railway CLI…"
            export DATABASE_URL="$(node scripts/resolve-railway-database-url.mjs)"
            node -e "const u=new URL(process.env.DATABASE_URL); console.log('Postgres host:', u.hostname)"
          fi
          node scripts/apply-db-schema.mjs

      - name: Verify community status
        env:
          PRODUCTION_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        run: |
          BASE="${PRODUCTION_URL:-https://kickboard-production.up.railway.app}"
          BASE="${BASE%/}"
          echo "Checking ${BASE}/api/community/status …"
          for attempt in $(seq 1 12); do
            body=$(curl -fsS "${BASE}/api/community/status" || true)
            echo "$body"
            if echo "$body" | grep -q '"schemaReady":true'; then
              echo "Community schema is ready."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::schemaReady is still false; check Railway Postgres and re-run this workflow."
          exit 1
