name: Deploy to Railway (kickboard project)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-deploy-kickboard
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to existing kickboard Railway service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
        run: |
          missing=0
          for name in RAILWAY_TOKEN RAILWAY_PROJECT_ID RAILWAY_SERVICE_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (required to deploy into the existing kickboard project, not a new one)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Add secrets from Railway → kickboard project → Settings / service Settings."
            exit 1
          fi
          npm install -g @railway/cli
          source scripts/railway-target.sh
          echo "Deploying to project $RAILWAY_PROJECT_ID, service $RAILWAY_SERVICE_ID"
          railway up --detach "${RAILWAY_TARGET_ARGS[@]}"

      - name: Configure Railway variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_DATA_SOURCES_TOKEN: ${{ secrets.ADMIN_DATA_SOURCES_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            exit 0
          fi
          chmod +x scripts/configure-railway-variables.sh scripts/railway-target.sh
          bash scripts/configure-railway-variables.sh
