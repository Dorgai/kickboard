name: Deploy to Railway (kickboard production)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-deploy-kickboard-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Locked: kickboard project, production environment only (see deploy/railway.project.json).
      RAILWAY_ENVIRONMENT: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Resolve kickboard production target
        id: target
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN is required (kickboard project → Settings → Tokens)."
            exit 1
          fi
          npm install -g @railway/cli
          chmod +x scripts/railway-target.sh
          source scripts/railway-target.sh
          echo "project_id=$RAILWAY_PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "service_id=$RAILWAY_SERVICE_ID" >> "$GITHUB_OUTPUT"
          echo "environment=$RAILWAY_ENVIRONMENT" >> "$GITHUB_OUTPUT"

      - name: Deploy to kickboard production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ steps.target.outputs.project_id }}
          RAILWAY_SERVICE_ID: ${{ steps.target.outputs.service_id }}
        run: |
          npm install -g @railway/cli
          source scripts/railway-target.sh
          railway up --detach "${RAILWAY_TARGET_ARGS[@]}"

      - name: Configure kickboard production variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ steps.target.outputs.project_id }}
          RAILWAY_SERVICE_ID: ${{ steps.target.outputs.service_id }}
          RAILWAY_PROJECT_NAME: ${{ vars.RAILWAY_PROJECT_NAME }}
          RAILWAY_SERVICE_NAME: ${{ vars.RAILWAY_SERVICE_NAME }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_DATA_SOURCES_TOKEN: ${{ secrets.ADMIN_DATA_SOURCES_TOKEN }}
        run: |
          chmod +x scripts/configure-railway-variables.sh scripts/railway-target.sh
          bash scripts/configure-railway-variables.sh
