name: Deploy to Railway (kickboard production)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_variables:
        description: Sync optional secrets/vars to Railway (only set values present in GitHub secrets)
        required: false
        default: false
        type: boolean

concurrency:
  group: railway-deploy-kickboard-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Locked: kickboard project, production environment only (see deploy/railway.project.json).
      RAILWAY_ENVIRONMENT: production
      PRODUCTION_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to kickboard production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "::error::Add GitHub secret RAILWAY_TOKEN (kickboard project → Settings → Tokens)."
            exit 1
          fi
          npm install -g @railway/cli
          SERVICE_NAME=$(node -e "console.log(JSON.parse(require('fs').readFileSync('deploy/railway.project.json','utf8')).serviceName)")
          DEPLOY_ARGS=(--detach)
          # Project tokens cannot call `railway project list`; they deploy via RAILWAY_TOKEN alone.
          if [ -n "${{ secrets.RAILWAY_PROJECT_ID }}" ] && [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            DEPLOY_ARGS+=(--project "${{ secrets.RAILWAY_PROJECT_ID }}" --service "${{ secrets.RAILWAY_SERVICE_ID }}" --environment production)
            echo "Deploying with RAILWAY_PROJECT_ID + RAILWAY_SERVICE_ID."
          elif [ -n "${{ secrets.RAILWAY_SERVICE_ID }}" ]; then
            DEPLOY_ARGS+=(--service "${{ secrets.RAILWAY_SERVICE_ID }}")
            echo "Deploying with RAILWAY_SERVICE_ID."
          else
            DEPLOY_ARGS+=(--service "$SERVICE_NAME")
            echo "Deploying service \"$SERVICE_NAME\" with project token (production scope)."
          fi
          railway up "${DEPLOY_ARGS[@]}"

      - name: Sync Railway variables (optional)
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.sync_variables == true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          SKIP_FINAL_REDEPLOY: "1"
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_DATA_SOURCES_TOKEN: ${{ secrets.ADMIN_DATA_SOURCES_TOKEN }}
        run: |
          npm install -g @railway/cli
          chmod +x scripts/configure-railway-variables.sh scripts/railway-target.sh
          bash scripts/configure-railway-variables.sh

      - name: Wait for production rollout
        run: |
          BASE="${PRODUCTION_URL:-https://kickboard-production.up.railway.app}"
          BASE="${BASE%/}"
          echo "Waiting for ${BASE} to serve current main (health + new routes) ..."
          for attempt in $(seq 1 36); do
            healthy=false
            if curl -fsS "${BASE}/api/health" 2>/dev/null | grep -q '"ok":true'; then
              healthy=true
            fi
            session_code=$(curl -sS -o /dev/null -w "%{http_code}" "${BASE}/api/admin/session" 2>/dev/null || echo "000")
            has_old_home=$(curl -sS "${BASE}/" 2>/dev/null | grep -c feed-status-grid || echo 1)
            if [ "$healthy" = true ] && [ "$session_code" != "404" ] && [ "$has_old_home" = "0" ]; then
              echo "Production matches current main (session=${session_code}, no feed-status-grid)."
              echo "production_url=${BASE}" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "Attempt ${attempt}/36: health=${healthy} session=${session_code} feed-status-grid=${has_old_home}"
            sleep 10
          done
          echo "::error::Production did not roll out current main within 6 minutes."
          exit 1
