name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: railway-deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN is not configured. Skipping CLI deploy."
            echo "Connect the kickboard Railway service to GitHub branch main, or add RAILWAY_TOKEN to repo secrets."
            exit 0
          fi
          npm install -g @railway/cli
          if [ -n "$RAILWAY_SERVICE_ID" ]; then
            railway up --detach --service "$RAILWAY_SERVICE_ID"
          else
            railway up --detach
          fi

      - name: Configure Railway variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_DATA_SOURCES_TOKEN: ${{ secrets.ADMIN_DATA_SOURCES_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Skipping variable sync (no RAILWAY_TOKEN)."
            exit 0
          fi
          chmod +x scripts/configure-railway-variables.sh
          bash scripts/configure-railway-variables.sh || echo "::warning::Variable sync failed (service may need RAILWAY_SERVICE_ID)."
